<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="A small dot slowly orbiting a point">
  <g fill="none" stroke="#8b949e" stroke-width="1">
    <ellipse cx="450" cy="80" rx="360" ry="46" opacity="0.35" transform="rotate(-6 450 80)"/>
    <ellipse cx="450" cy="80" rx="240" ry="30" opacity="0.2" transform="rotate(-6 450 80)"/>
  </g>
  <circle cx="450" cy="80" r="4" fill="#8b949e" opacity="0.8"/>
  <g transform="rotate(-6 450 80)">
    <circle r="3" fill="#8b949e">
      <animateMotion dur="40s" repeatCount="indefinite" path="M 90,80 a 360,46 0 1,0 720,0 a 360,46 0 1,0 -720,0"/>
    </circle>
    <circle r="2" fill="#8b949e" opacity="0.6">
      <animateMotion dur="24s" repeatCount="indefinite" path="M 210,80 a 240,30 0 1,1 480,0 a 240,30 0 1,1 -480,0"/>
    </circle>
  </g>
  <g fill="#8b949e" opacity="0.4">
    <circle cx="80" cy="30" r="1"/>
    <circle cx="190" cy="132" r="1"/>
    <circle cx="330" cy="18" r="1"/>
    <circle cx="610" cy="140" r="1"/>
    <circle cx="760" cy="26" r="1"/>
    <circle cx="840" cy="118" r="1"/>
  </g>
</svg>
